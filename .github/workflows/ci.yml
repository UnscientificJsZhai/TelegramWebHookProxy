name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend dependencies
        working-directory: webui
        run: npm ci

      - name: Run frontend unit tests
        working-directory: webui
        run: npm test

      - name: Run frontend lint
        working-directory: webui
        run: npm run lint

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: liberica

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run backend tests and build project
        run: ./gradlew build

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: 21

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
          upload-result: true
          artifact-name: qodana-report
          cache-default-branch-only: true

      - name: Upload Qodana SARIF to GitHub Code Scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana-jvm
